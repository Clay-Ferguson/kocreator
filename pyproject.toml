[project]
name = "kocreator"
version = "0.1.0"
description = "Build narrated demo videos (MP4 + GIF) from screenshots and text, with speech from a pluggable TTS folder"
# `.python-version` pins 3.12, which uv fetches into its shared store if the
# machine doesn't have it. (3.11+ is needed for tomllib.)
requires-python = ">=3.12"

# create-video.py uses only the standard library: video work is done by the
# ffmpeg/ffprobe binaries, and speech by a TTS plugin folder (../kocreator-*),
# which runs its engine in its own environment. Read the "Upgrading
# Dependencies" section of README.md before adding anything here.
dependencies = []

# Not an installable package: uv only builds the virtualenv from the dependencies
# above, and the scripts run straight out of the tree via `uv run`.
[tool.uv]
package = false
